<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Report Found Item</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 24px 0;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Main Background */

        .main-container {
            width: 94%;
            max-width: 900px;
            min-height: 640px;
            margin: auto;
            background-color: #fbf6df;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Form Container */

        .form-container {
            width: 56%;
            max-width: 495px;
            background-color: white;
            border-radius: 17px;
            padding: 8px 10px 12px;
        }

        /* Form Heading */

        .form-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 0 2px;
        }

        .heading-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .box-icon {
            width: 27px;
            height: 27px;
            color: #ff9d16;
            font-size: 27px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .form-heading h2 {
            font-family: Arial, sans-serif;
            font-size: 21px;
            font-weight: bold;
            color: black;
            margin: 0;
        }

        .close-icon {
            font-family: Arial, sans-serif;
            font-size: 25px;
            color: black;
            margin-right: 12px;
        }

        /* Form Labels */

        .form-label {
            font-size: 20px;
            color: black;
            margin-bottom: 5px;
        }

        /* Input Fields */

        .form-control,
        .form-select {
            background-color: #d9d9d9;
            border: none;
            border-radius: 18px;
            height: 42px;
            font-family: Georgia, serif;
            font-size: 15px;
            color: black;
            padding: 8px 13px;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #897d7a;
            opacity: 1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #d9d9d9;
            border: none;
            box-shadow: none;
        }

        /* Category and Location */

        .two-column {
            display: flex;
            gap: 60px;
            margin-top: 20px;
        }

        .column {
            width: 50%;
        }

        /* Public Description */

        .description-section {
            margin-top: 36px;
        }

        .description-box {
            height: 83px;
            resize: none;
            border-radius: 16px;
        }

        /* Verification Question */

        .verification-section {
            margin-top: 15px;
        }

        .verification-box {
            height: 70px;
            resize: none;
            border-radius: 16px;
        }

        /* Buttons */

        .button-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-top: 48px;
        }

        .cancel-btn {
            background-color: #df7777;
            color: white;
            border: none;
            border-radius: 20px;
            font-family: Georgia, serif;
            font-size: 19px;
            padding: 3px 23px;
        }

        .submit-btn {
            background-color: #1710b9;
            color: white;
            border: none;
            border-radius: 20px;
            font-family: Georgia, serif;
            font-size: 19px;
            padding: 3px 20px;
        }

        /* Responsive Design */

        @media (max-width: 768px) {

            .main-container {
                min-height: 100vh;
            }

            .form-container {
                width: 95%;
            }

            .two-column {
                gap: 15px;
            }

            .form-label {
                font-size: 17px;
            }

            .form-heading h2 {
                font-size: 18px;
            }

            .button-section {
                gap: 8px;
                margin-top: 30px;
            }

            .cancel-btn,
            .submit-btn {
                font-size: 15px;
                padding: 5px 12px;
            }

        }

        @media (max-width: 400px) {

            .two-column {
                flex-direction: column;
                gap: 10px;
            }

            .column {
                width: 100%;
            }

        }

    </style>
</head>

<body>

    <!-- Main Background -->

    <div class="main-container">

        <!-- Report Found Form -->

        <div class="form-container">

            <!-- Form Heading -->

            <div class="form-heading">

                <div class="heading-left">

                    <div class="box-icon">
                        ◈
                    </div>

                    <h2>
                        Report a Found Item
                    </h2>

                </div>

                <div class="close-icon">
                    ×
                </div>

            </div>


            <!-- Item Name -->

            <div class="mb-3">

                <label class="form-label">
                    Item Name
                </label>

                <input type="text"
                       class="form-control"
                       placeholder="eg: blue headphone">

            </div>


            <!-- Category and Location -->

            <div class="two-column">

                <div class="column">

                    <label class="form-label">
                        Category
                    </label>

                    <select class="form-select">

                        <option selected>Enter</option>

                        <option>Electronics</option>

                        <option>Stationery</option>

                        <option>Keys and ID</option>

                        <option>Others</option>

                    </select>

                </div>


                <div class="column">

                    <label class="form-label">
                        Last Seen Location
                    </label>

                    <select class="form-select">

                        <option selected>Enter</option>

                        <option>Main Library</option>

                        <option>Digital Tower</option>
                        <option>MBA block</option>
                        <option>EEE Building</option>
                        <option>GYMNASIUM</option>
                        <option>Boys Mess</option>
                        <option>Parking</option>
                        <option>Playground</option>
                        <option>Open Threatre</option>
                        <option>Amul and Snackify</option>

                        <option>ECS Building</option>

                        <option>Canteen</option>

                        <option>G-Block</option>

                    </select>

                </div>

            </div>


            <!-- Public Description -->

            <div class="description-section">

                <label class="form-label">
                    Public Description
                </label>

                <textarea class="form-control description-box"
                          placeholder="Describe general things keeping private things hidden"></textarea>

            </div>


            <!-- Verification Question -->

            <div class="verification-section">

                <label class="form-label">
                    Verification Question for Owner
                </label>

                <textarea class="form-control verification-box"
                          placeholder="e.g. What sticker is on the back of headphone?"></textarea>

            </div>


            <!-- Form Buttons -->

            <div class="button-section">

                <button type="button" class="cancel-btn">
                <a href="frame1.html">Cancel</a>
                </button>

                <button type="submit" class="submit-btn">
                    <a href="frame1.html">Report Found item</a>
                </button>

            </div>

        </div>

    </div>

</body>
</html>
