<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 25px 0;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Main Background */

        .main-container {
            width: 92.5%;
            max-width: 900px;
            min-height: 640px;
            margin: auto;
            background-color: #fbf6df;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Registration Card */

        .register-container {
            width: 455px;
            height: 600px;
            background-color: white;
            border-radius: 30px;
            padding: 28px 26px 19px;
        }

        /* Inner Grey Card */

        .register-box {
            width: 100%;
            height: 100%;
            background-color: #d9d9d9;
            border-radius: 48px;
            position: relative;
            padding: 8px 15px;
        }

        /* Dashed Vertical Lines */

        .register-box::before {
            content: "";
            position: absolute;
            top: 25px;
            bottom: 12px;
            left: -14px;
            border-left: 3px dashed black;
        }

        .register-box::after {
            content: "";
            position: absolute;
            top: 25px;
            bottom: 12px;
            right: -14px;
            border-right: 3px dashed black;
        }

        /* Registration Heading */

        .register-title {
            text-align: center;
            color: black;
            font-family: Arial, sans-serif;
            font-size: 31px;
            font-weight: bold;
            line-height: 1.1;
            margin: 0 0 28px;
        }

        /* Form Rows */

        .form-row {
            display: flex;
            align-items: center;
            height: 51px;
            margin-bottom: 0;
            color: black;
        }

        .form-icon {
            width: 36px;
            font-size: 25px;
            color: black;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            width: 100%;
            min-width: 0;
            border: none;
            outline: none;
            background-color: transparent;
            font-family: Georgia, serif;
            font-size: 21px;
            font-weight: bold;
            color: black;
            padding: 4px 0;
        }

        .form-row input::placeholder {
            color: black;
            opacity: 1;
        }

        .form-row select {
            appearance: none;
        }

        /* Register Button */

        .button-section {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .register-btn {
            width: 185px;
            height: 36px;
            background-color: #965454;
            color: white;
            border: none;
            border-radius: 17px;
            font-family: Georgia, serif;
            font-size: 25px;
            line-height: 1;
        }

        /* Responsive Design */

        @media (max-width: 600px) {

            .main-container {
                min-height: 100vh;
            }

            .register-container {
                width: 92%;
                height: 600px;
                padding: 25px 22px;
            }

            .register-title {
                font-size: 25px;
            }

            .form-row input,
            .form-row select {
                font-size: 17px;
            }

            .form-icon {
                font-size: 21px;
                width: 32px;
            }

        }

    </style>
</head>

<body>

    <!-- Main Background -->

    <div class="main-container">

        <!-- Outer Registration Card -->

        <div class="register-container">

            <!-- Inner Grey Card -->

            <div class="register-box">


                <!-- Registration Heading -->

                <h1 class="register-title">
                    Create your Account<br>
                    Join the HUNT!!
                </h1>


                <!-- Username -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-person"></i>
                    </div>

                    <input type="text"
                           placeholder="Username-">

                </div>


                <!-- Email -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-envelope"></i>
                    </div>

                    <input type="email"
                           placeholder="email-">

                </div>


                <!-- Password -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-lock-fill"></i>
                    </div>

                    <input type="password"
                           placeholder="password-">

                </div>


                <!-- Confirm Password -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-check-circle"></i>
                    </div>

                    <input type="password"
                           placeholder="confirm password-">

                </div>


                <!-- Gender -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-gender-ambiguous"></i>
                    </div>

                    <select>

                        <option selected disabled>gender-</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>


                <!-- Year -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-pc-display"></i>
                    </div>

                    <select>

                        <option selected disabled>year-</option>

                        <option>First Year</option>

                        <option>Second Year</option>

                        <option>Third Year</option>

                        <option>Fourth Year</option>

                    </select>

                </div>


                <!-- Branch -->

                <div class="form-row">

                    <div class="form-icon">
                        <i class="bi bi-person-vcard"></i>
                    </div>

                    <select>

                        <option selected disabled>branch-</option>

                        <option>Computer Science</option>

                        <option>Information Technology</option>

                        <option>Mechanical Engineering</option>

                        <option>Civil Engineering</option>

                        <option>Electronics Engineering</option>
                        <option> Electronics and Telecommunication</option>
                        <option>Electronics and Computer Science</option>

                    </select>

                </div>


                <!-- Register Button -->

                <div class="button-section">

                    <button type="submit" class="register-btn">
                        <a href="frame1.html">Register</a>
                    </button>

                </div>


            </div>

        </div>

    </div>

</body>
</html>
