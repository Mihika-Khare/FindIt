<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - My Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px 0;
            font-family: Georgia, 'Times New Roman', serif;
        }


        .main-container {
            width: 94%;
            max-width: 900px;
            min-height: 640px;
            margin: auto;
            background-color: #fbf6df;
            padding: 0 10px 15px;
        }


        .portal-heading {
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7px;
        }

        .heading-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .cap-icon {
            font-size: 58px;
            color: black;
        }

        .portal-heading h1 {
            font-size: 43px;
            font-weight: bold;
            color: black;
            margin: 0;
        }

        .bell-icon {
            font-size: 46px;
            color: black;
        }


        .dashboard-container {
            height: 538px;
            background-color: #8b3e50;
            border-radius: 47px;
            padding: 15px;
        }


        .dashboard-inner {
            height: 100%;
            background-color: white;
            border-radius: 43px;
            overflow: hidden;
            position: relative;
        }

        

        .dashboard-navbar {
            height: 114px;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 12px;
            gap: 32px;
        }

        .dashboard-navbar a {
            color: black;
            text-decoration: none;
            font-size: 22px;
            white-space: nowrap;
        }

        .dashboard-navbar .active {
            background-color: #1710b9;
            color: white;
            padding: 1px 15px;
            border-radius: 25px;
        }


        .profile-avatar {
            width: 145px;
            height: 145px;
            background-color: #b5b5b5;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 2px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #aaa;
        }

        .avatar-inner {
            width: 115px;
            height: 115px;
            background-color: black;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .avatar-head {
            width: 43px;
            height: 43px;
            background-color: #b5b5b5;
            border-radius: 50%;
            position: absolute;
            top: 14px;
            left: 36px;
        }

        .avatar-body {
            width: 92px;
            height: 55px;
            background-color: #b5b5b5;
            border-radius: 45px 45px 0 0;
            position: absolute;
            bottom: -8px;
            left: 11px;
        }


        .content-section {
            display: flex;
            gap: 25px;
            padding: 31px 17px 10px;
            height: 394px;
        }


        .personal-card {
            width: 49%;
            height: 350px;
            background-color: #d9d9d9;
            border: 2px solid #079dff;
            border-radius: 48px;
            padding: 9px 12px;
        }

        .personal-card h2 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 7px;
            color: black;
        }

        .personal-row {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 48px;
        }

        .personal-row i {
            width: 35px;
            font-size: 29px;
            color: black;
            text-align: center;
        }

        .personal-row span {
            font-family: Arial, sans-serif;
            font-size: 23px;
            font-weight: bold;
            color: black;
            white-space: nowrap;
        }


        .right-section {
            width: 51%;
            display: flex;
            flex-direction: column;
            gap: 33px;
            padding-top: 1px;
        }


        .progress-card {
            height: 137px;
            background-color: #d9d9d9;
            border-radius: 47px;
            padding: 10px 15px;
            position: relative;
        }

        .progress-card h2 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            color: black;
        }

        .progress-line {
            height: 2px;
            background-color: black;
            position: absolute;
            top: 71px;
            left: 40px;
            right: 40px;
        }

        .progress-items {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            margin-top: 11px;
        }

        .progress-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: black;
        }

        .progress-circle {
            width: 43px;
            height: 43px;
            border: 2px solid black;
            background-color: #d9d9d9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .progress-circle.completed {
            background-color: black;
            color: white;
        }

        .progress-circle.review {
            background-color: black;
            color: white;
            font-size: 20px;
        }

        .progress-item span {
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }


        .statistics-card {
            height: 137px;
            background-color: #d9d9d9;
            border-radius: 48px;
            display: flex;
            align-items: center;
            padding: 12px 7px;
            gap: 30px;
        }


        .pie-chart {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            border-radius: 50%;
            background: conic-gradient(
                black 0deg 180deg,
                black 180deg 270deg,
                white 270deg 360deg
            );
            border: 6px solid black;
        }


        .statistics-text {
            font-family: Arial, sans-serif;
            font-size: 21px;
            font-weight: bold;
            line-height: 1.65;
            color: black;
            white-space: nowrap;
        }

        .report-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: -22px;
        }

        .report-buttons button {
            width: 50%;
            height: 30px;
            border: none;
            border-radius: 20px;
            color: black;
            font-family: Georgia, serif;
            font-size: 23px;
            line-height: 1;
        }

        .lost-btn {
            background-color: #405bd0;
        }

        .found-btn {
            background-color: #ff9914;
        }

        @media (max-width: 768px) {

            .main-container {
                min-height: 100vh;
            }

            .portal-heading h1 {
                font-size: 32px;
            }

            .cap-icon {
                font-size: 42px;
            }

            .dashboard-container {
                height: auto;
                border-radius: 30px;
            }

            .dashboard-inner {
                overflow: visible;
                border-radius: 25px;
            }

            .dashboard-navbar {
                height: auto;
                min-height: 100px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                padding: 15px;
            }

            .dashboard-navbar a {
                font-size: 17px;
            }

            .profile-avatar {
                width: 90px;
                height: 90px;
                top: -10px;
            }

            .avatar-inner {
                width: 70px;
                height: 70px;
            }

            .avatar-head {
                width: 27px;
                height: 27px;
                left: 21px;
                top: 9px;
            }

            .avatar-body {
                width: 58px;
                height: 34px;
                left: 6px;
            }

            .content-section {
                height: auto;
                flex-direction: column;
                padding: 20px 12px;
            }

            .personal-card,
            .right-section {
                width: 100%;
            }

            .personal-card {
                height: auto;
                padding: 15px;
            }

            .personal-row span {
                font-size: 18px;
            }

            .right-section {
                gap: 20px;
            }

            .statistics-card {
                justify-content: space-around;
            }

            .report-buttons {
                margin-top: 0;
            }

        }

        @media (max-width: 400px) {

            .personal-row span {
                font-size: 15px;
            }

            .statistics-text {
                font-size: 16px;
            }

            .progress-item span {
                font-size: 12px;
            }

            .report-buttons button {
                font-size: 17px;
            }

        }

    </style>
</head>

<body>

        <div class="portal-heading">

            <div class="heading-left">

                <i class="bi bi-mortarboard-fill cap-icon"></i>

                <h1>My Portal</h1>

            </div>

            <i class="bi bi-bell-fill bell-icon"></i>

        </div>


        <div class="dashboard-container">

            <div class="dashboard-inner">


                <nav class="dashboard-navbar">

</body>
</html>
