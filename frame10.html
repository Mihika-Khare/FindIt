<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Secure Claim Verification</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            padding: 17px 0;
            background-color: #f5f5f5;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Main Background */

        .main-container {
            width: 94%;
            max-width: 900px;
            height: 640px;
            margin: auto;
            background-color: #fbf6df;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Verification Card */

        .verification-card {
            width: 510px;
            height: 578px;
            background-color: white;
            border-radius: 27px;
            padding: 10px 12px;
            position: relative;
        }

        /* Heading */

        .heading {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 5px;
            gap: 10px;
        }

        .shield-icon {
            color: #4285f4;
            font-size: 38px;
        }

        .heading h1 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: black;
            margin: 0;
        }

        .close-icon {
            position: absolute;
            right: 13px;
            top: 0px;
            font-size: 35px;
            font-weight: 200;
            color: black;
            cursor: pointer;
        }

        /* Item Information */

        .item-information {
            height: 111px;
            background-color: #e8e6e4;
            border-radius: 30px;
            margin-top: 0;
            padding: 14px 20px;
        }

        .item-information h2 {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 23px;
            font-weight: bold;
            color: black;
            margin: 0 0 28px;
        }

        .item-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 0 17px;
        }

        .item-details span {
            font-size: 16px;
            color: #222;
        }

        .tracking-id {
            background-color: #1710b9;
            color: white;
            padding: 7px 10px;
            border-radius: 25px;
            font-size: 16px;
            white-space: nowrap;
        }

        /* Privacy Protection Message */

        .privacy-message {
            height: 78px;
            background-color: #7ac4eb;
            border-radius: 19px;
            margin-top: 12px;
            padding: 1px 9px;
            color: #064d18;
            font-size: 20px;
            line-height: 1.2;
        }

        /* Verification Question */

        .question-section {
            margin-top: 18px;
            padding: 0 8px;
        }

        .question-section p {
            font-size: 21px;
            color: black;
            line-height: 1.15;
            margin-bottom: 14px;
        }

        /* Answer Input */

        .answer-input {
            width: 100%;
            height: 52px;
            border: none;
            outline: none;
            border-radius: 20px;
            background-color: #fbf5df;
            padding: 0 29px;
            font-family: Georgia, serif;
            font-size: 20px;
            color: #444;
        }

        .answer-input::placeholder {
            color: #555;
            opacity: 1;
        }

        /* Email Section */

        .email-section {
            margin-top: 23px;
            padding: 0 6px;
        }

        .email-section label {
            display: block;
            font-size: 20px;
            color: black;
            margin-bottom: 5px;
        }

        .email-input {
            width: 100%;
            height: 36px;
            border: none;
            outline: none;
            border-radius: 20px;
            background-color: #fbf5df;
            padding: 0 37px;
            font-family: Georgia, serif;
            font-size: 20px;
            color: #444;
        }

        .email-input::placeholder {
            color: #555;
            opacity: 1;
        }

        /* Verify Button */

        .button-section {
            display: flex;
            justify-content: flex-end;
            margin-top: 38px;
            padding-right: 13px;
        }

        .verify-btn {
            width: 253px;
            height: 42px;
            background-color: #e6c10c;
            border: none;
            border-radius: 25px;
            color: black;
            font-family: Georgia, serif;
            font-size: 21px;
            font-weight: bold;
        }

        /* Responsive Design */

        @media (max-width: 600px) {

            .main-container {
                width: 96%;
                min-height: 100vh;
                height: auto;
                padding: 20px 0;
            }

            .verification-card {
                width: 94%;
                height: auto;
                min-height: 578px;
            }

            .heading h1 {
                font-size: 19px;
            }

            .item-information h2 {
                font-size: 18px;
            }

            .item-details span {
                font-size: 12px;
            }

            .tracking-id {
                font-size: 12px;
            }

            .privacy-message {
                font-size: 16px;
                height: auto;
                min-height: 78px;
            }

            .question-section p {
                font-size: 17px;
            }

            .answer-input,
            .email-input {
                font-size: 15px;
            }

            .email-section label {
                font-size: 17px;
            }

            .verify-btn {
                font-size: 17px;
                width: 230px;
            }

        }

    </style>

</head>

<body>

    <!-- Main Background -->

    <div class="main-container">

        <!-- Verification Card -->

        <div class="verification-card">


            <!-- Heading -->

            <div class="heading">

                <i class="bi bi-shield-fill-check shield-icon"></i>

                <h1>Secure claim verification</h1>

            </div>

            <!-- Close Icon -->

            <i class="bi bi-x close-icon"></i>


            <!-- Item Information -->

            <div class="item-information">

                <h2>
                    Silver Aluminium Laptop(14 inch)
                </h2>

                <div class="item-details">

                    <span>
                        Main Library .Nov 16,2026,.2:15pm
                    </span>

                    <span class="tracking-id">
                        FND-2026-1042
                    </span>

                </div>

            </div>


            <!-- Privacy Protection Message -->

            <div class="privacy-message">

                Privacy Protection: Identifying details are hidden.Answer the verification prompt below to prove ownership

            </div>


            <!-- Verification Question -->

            <div class="question-section">

                <p>
                    What sticker is on the bottom case or what is the wallpaper of the lock screen?
                </p>

                <input
                    type="text"
                    class="answer-input"
                    placeholder="Enter your specific identifying answer....">

            </div>


            <!-- Campus Email -->

            <div class="email-section">

                <label>
                    Enter your campus Email ID:
                </label>

                <input
                    type="email"
                    class="email-input"
                    placeholder="26name@rbunagpur.in">

            </div>


            <!-- Verify Button -->

            <div class="button-section">

                <button type="button" class="verify-btn">

                    <a href="frame11.html">Verify and Submit form</a>

                </button>

            </div>


        </div>

    </div>

</body>

</html>
