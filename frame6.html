<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Report Lost Item</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 15px 0;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Main Background */

        .main-container {
            width: 96%;
            max-width: 900px;
            min-height: 640px;
            margin: auto;
            background-color: #fbf6df;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Report Form */

        .form-container {
            width: 56%;
            max-width: 500px;
            background-color: white;
            border-radius: 17px;
            padding: 8px 10px 12px;
        }

        /* Form Heading */

        .form-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 25px;
            padding: 0 2px;
        }

        .heading-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .warning-icon {
            width: 27px;
            height: 27px;
            border: 2px solid #13b96b;
            color: #13b96b;
            border-radius: 50%;
            font-family: Arial, sans-serif;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-heading h2 {
            font-family: Arial, sans-serif;
            font-size: 21px;
            font-weight: bold;
            color: black;
            margin: 0;
        }

        .close-icon {
            font-family: Arial, sans-serif;
            font-size: 25px;
            color: black;
            font-weight: normal;
            margin-right: 12px;
        }

        /* Form Labels */

        .form-label {
            font-size: 20px;
            color: black;
            margin-bottom: 5px;
        }

        /* Input Fields */

        .form-control,
        .form-select {
            background-color: #d9d9d9;
            border: none;
            border-radius: 18px;
            height: 42px;
            font-family: Georgia, serif;
            font-size: 15px;
            color: black;
            padding: 8px 13px;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #897d7a;
            opacity: 1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #d9d9d9;
            box-shadow: none;
            border: none;
        }

        /* Two Column Section */

        .two-column {
            display: flex;
            gap: 60px;
            margin-top: 20px;
        }

        .column {
            width: 50%;
        }

        /* Description Textarea */

        .description-section {
            margin-top: 36px;
        }

        .description-box {
            height: 82px;
            resize: none;
            border-radius: 16px;
        }

        /* Private Details */

        .private-section {
            margin-top: 15px;
        }

        .private-box {
            height: 70px;
            resize: none;
            border-radius: 16px;
        }

        .help-text {
            font-size: 15px;
            color: #897d7a;
            line-height: 1.2;
            margin: 5px 10px 10px;
        }

        /* Buttons */

        .button-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .cancel-btn {
            background-color: #df7777;
            color: white;
            border: none;
            border-radius: 20px;
            font-family: Georgia, serif;
            font-size: 19px;
            padding: 3px 23px;
        }

        .submit-btn {
            background-color: #1710b9;
            color: white;
            border: none;
            border-radius: 20px;
            font-family: Georgia, serif;
            font-size: 19px;
            padding: 3px 27px;
        }

        /* Responsive Design */

        @media (max-width: 768px) {

            .main-container {
                min-height: 100vh;
            }

            .form-container {
                width: 95%;
            }

            .two-column {
                gap: 15px;
            }

            .form-label {
                font-size: 17px;
            }

            .form-heading h2 {
                font-size: 18px;
            }

            .button-section {
                gap: 8px;
            }

            .cancel-btn,
            .submit-btn {
                font-size: 15px;
                padding: 5px 12px;
            }

        }

        @media (max-width: 400px) {

            .two-column {
                flex-direction: column;
                gap: 10px;
            }

            .column {
                width: 100%;
            }

        }

    </style>
</head>

<body>

    <!-- Main Background -->

    <div class="main-container">

        <!-- Report Lost Form -->

        <div class="form-container">

            <!-- Form Heading -->

            <div class="form-heading">

                <div class="heading-left">

                    <div class="warning-icon">
                        </div>

                    <h2>
                        Report a lost item
                    </h2>

                </div>

                <div class="close-icon">
                    ×
                </div>

            </div>


            <!-- Item Name -->

            <div class="mb-3">

                <label class="form-label">
                    Item Name
                </label>

                <input type="text"
                       class="form-control"
                       placeholder="eg: Black Airpods with doraemon sticker">

            </div>


            <!-- Category and Location -->

            <div class="two-column">

                <div class="column">

                    <label class="form-label">
                        Category
                    </label>

                    <select class="form-select">

                        <option selected>Enter</option>

                        <option>Electronics</option>

                        <option>Stationery</option>

                        <option>Keys and ID</option>

                        <option>Others</option>

                    </select>

                </div>


                <div class="column">

                    <label class="form-label">
                        Last Seen Location
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Enter">

                </div>

            </div>


            <!-- Public Description -->

            <div class="description-section">

                <label class="form-label">
                    Public Description
                </label>

                <textarea class="form-control description-box"
                          placeholder="General Appearance without revealing private details"></textarea>

            </div>


            <!-- Private Identifying Details -->

            <div class="private-section">

                <label class="form-label">
                    Private Identifying Details (Hidden)
                </label>

                <textarea class="form-control private-box"
                          placeholder="e.g. Bluetooth Name"></textarea>

                <p class="help-text">
                    used to verify if someone finds your item and nobody else can claim it
                </p>

            </div>


            <!-- Form Buttons -->

            <div class="button-section">

                <button type="button" class="cancel-btn">
                    <a href="frame1.html">Cancel</a>
                </button>

                <button type="submit" class="submit-btn">
                    <a href="frame8.html">Submit Lost Report</a>
                </button>

            </div>

        </div>

    </div>

</body>
</html>
