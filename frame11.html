<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Claim Submitted</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 22px 0;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Main Background */

        .main-container {
            width: 94%;
            max-width: 900px;
            height: 640px;
            margin: auto;
            background-color: #fbf6df;
            position: relative;
            overflow: hidden;
        }

        /* Success Circle Outer */

        .success-circle {
            width: 160px;
            height: 160px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 42px auto 0;
        }

        /* Green Circle */

        .inner-circle {
            width: 120px;
            height: 120px;
            border: 3px solid #10b65d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Check Mark */

        .check-mark {
            width: 42px;
            height: 22px;
            border-left: 3px solid #10b65d;
            border-bottom: 3px solid #10b65d;
            transform: rotate(-45deg);
            margin-top: -12px;
            margin-left: 5px;
        }

        /* Success Message Box */

        .message-box {
            width: 468px;
            height: 204px;
            background-color: #ff9409;
            border-radius: 16px;
            margin: 72px auto 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 8px;
        }

        /* Close Button */

        .close-button {
            position: absolute;
            top: 3px;
            right: 9px;
            color: #00a76a;
            font-family: Arial, sans-serif;
            font-size: 39px;
            font-weight: normal;
            line-height: 1;
        }

        /* Message Text */

        .message-text {
            color: black;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 23px;
            line-height: 1.25;
            margin: 0;
            text-align: left;
        }

        /* Responsive Design */

        @media (max-width: 600px) {

            .main-container {
                height: 100vh;
            }

            .success-circle {
                width: 140px;
                height: 140px;
            }

            .inner-circle {
                width: 105px;
                height: 105px;
            }

            .message-box {
                width: 90%;
                height: 190px;
                margin-top: 65px;
            }

            .message-text {
                font-size: 19px;
            }

        }

    </style>
</head>

<body>

    <!-- Main Background -->

    <div class="main-container">


        <!-- Success Icon -->

        <div class="success-circle">

            <div class="inner-circle">

                <div class="check-mark"></div>

            </div>

        </div>


        <!-- Success Message -->

        <div class="message-box">

            <!-- Close Icon -->

            <div class="close-button">
                <a href="frame1.html">x</a>
            </div>


            <!-- Message -->

            <p class="message-text">
                Claim submitted for Item :FND-2026-1042<br>
                Campus-Desk will review and Email you
            </p>

        </div>

    </div>

</body>
</html>
