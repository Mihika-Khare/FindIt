<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindIt - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 24px 0;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Main Container */

        .main-container {
            width: 92.5%;
            max-width: 900px;
            min-height: 640px;
            margin: auto;
            background-color: #fbf6df;
            padding: 0 10px;
        }

        /* Navigation Bar */

        .navbar-custom {
            height: 52px;
            border-bottom: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-size: 62px;
            font-weight: 900;
            letter-spacing: -5px;
            color: black;
            line-height: 1;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 23px;
            white-space: nowrap;
        }

        .nav-links .active {
            background-color: #1710b9;
            color: white;
            padding: 0 28px;
            border-radius: 25px;
        }

        /* Login Card Outer Border */

        .login-container {
            width: 410px;
            height: 495px;
            background-color: #8b3e50;
            border-radius: 47px;
            margin: 20px auto 0;
            padding: 15px 22px 20px;
        }

        /* Login Card Inner Area */

        .login-box {
            height: 100%;
            background-color: white;
            border-radius: 28px;
            position: relative;
            padding: 0 12px;
        }

        /* Dashed Vertical Lines */

        .login-box::before {
            content: "";
            position: absolute;
            top: 15px;
            bottom: 12px;
            left: 11px;
            border-left: 2px dashed black;
        }

        .login-box::after {
            content: "";
            position: absolute;
            top: 15px;
            bottom: 12px;
            right: 11px;
            border-right: 2px dashed black;
        }

        /* Login Heading */

        .login-title {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 40px;
            font-weight: bold;
            color: black;
            margin: 0;
            padding-top: 4px;
        }

        /* Login Form */

        .login-form {
            padding: 0 0;
            margin-top: 54px;
        }

        /* Input Fields */

        .input-group-custom {
            height: 32px;
            background-color: #54343d;
            border-radius: 20px;
            display: flex;
            align-items: center;
            margin-bottom: 27px;
            padding: 0 8px;
        }

        .input-icon {
            color: #eeeeee;
            font-size: 25px;
            margin-right: 5px;
        }

        .input-group-custom input {
            width: 85%;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: Georgia, serif;
            font-size: 20px;
        }

        .input-group-custom input::placeholder {
            color: white;
            opacity: 1;
        }

        /* Remember and Change Password */

        .remember-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -3px;
            padding: 0 0;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 20px;
            color: black;
        }

        .remember input {
            width: 23px;
            height: 25px;
            accent-color: #a00000;
        }

        .change-password {
            text-decoration: none;
            color: #253cc5;
            font-size: 18px;
            white-space: nowrap;
        }

        /* Register Section */

        .register-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 51px;
            font-family: Arial, sans-serif;
            font-size: 19px;
            font-weight: bold;
            white-space: nowrap;
        }

        .register-link {
            color: #253cc5;
            text-decoration: none;
        }

        /* Responsive Design */

        @media (max-width: 768px) {

            .main-container {
                min-height: 100vh;
            }

            .navbar-custom {
                height: auto;
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }

            .logo {
                font-size: 48px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }

            .nav-links a {
                font-size: 17px;
            }

            .login-container {
                width: 95%;
                max-width: 410px;
            }

            .login-title {
                font-size: 35px;
            }

            .remember {
                font-size: 16px;
            }

            .change-password {
                font-size: 15px;
            }

            .register-section {
                font-size: 16px;
            }

        }

    </style>
</head>

<body>

    <!-- Main Background -->

    <div class="main-container">

        <!-- Navigation Bar -->

        <nav class="navbar-custom">

            <div class="logo">
                Findit
            </div>

            <div class="nav-links">

                <a href="#">Home</a>

                <a href="#">Browse items</a>

                <a href="#">Campus Map</a>

                <a href="#">How it works</a>

                <a href="#" class="active">Login</a>

            </div>

        </nav>


        <!-- Login Container -->

        <div class="login-container">

            <div class="login-box">

                <!-- Login Heading -->

                <h1 class="login-title">
                    Login
                </h1>


                <!-- Login Form -->

                <div class="login-form">

                    <!-- Username -->

                    <div class="input-group-custom">

                        <i class="bi bi-person-fill input-icon"></i>

                        <input type="text"
                               placeholder="Username:">

                    </div>


                    <!-- College Email -->

                    <div class="input-group-custom">

                        <i class="bi bi-envelope-fill input-icon"></i>

                        <input type="email"
                               placeholder="Collage Email:">

                    </div>


                    <!-- Password -->

                    <div class="input-group-custom">

                        <i class="bi bi-key-fill input-icon"></i>

                        <input type="password"
                               placeholder="Password;">

                    </div>


                    <!-- Remember and Change Password -->

                    <div class="remember-section">

                        <label class="remember">

                            <input type="checkbox">

                            Remember?

                        </label>

                        <a href="#" class="change-password">
                            Change Password
                        </a>

                    </div>


                    <!-- Register Section -->

                    <div class="register-section">

                        <span>
                            Don’t have an Account?
                        </span>

                        <a href="frame3.html" class="register-link">
                            Register
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
